<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="shortcut icon" href="#" />

<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
    .container {
	    display: flex;
	    column-gap: 100px;
    }
</style>

<script src="./src/Utils/trackball-rotator.js"></script>
<script src="./src/Utils/m4.js"></script>
<script src="./src/main.mjs" type="module"></script>
<script src="./src/shader.glsl"></script>

</head>
<body>

<h2>A Surface of Revolution with Damping Circular Waves</h2>

<p id="message">Drag your mouse on the surface to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div class="container">
	<div id="canvas-holder">
		<canvas width="800" height="800" id="webglcanvas" style="background-color:red"></canvas>
	</div>

	<div>
		<div>
			<label for="eyeSeparation">Eye Separation: <span id="eyeSeparationValue">0.30</span></label><br>
			<input id="eyeSeparation" type="range" min="0" max="2" step="0.01" value="0.30">
		</div>
		<div>
			<label for="FOV">Field-of-View (rad): <span id="FOVValue">0.60</span></label><br>
			<input id="FOV" type="range" min="0.1" max="1.5" step="0.01" value="0.60">
		</div>
		<div>
			<label for="nearClippingDistance">Near Clip: <span id="nearClippingDistanceValue">0.60</span></label><br>
			<input id="nearClippingDistance" type="range" min="0.1" max="20" step="0.1" value="0.60">
		</div>
		<div>
			<label for="farClippingDistance">Far Clip: <span id="farClippingDistanceValue">20</span></label><br>
			<input id="farClippingDistance" type="range" min="0.1" max="20" step="0.1" value="20">
		</div>
		<div>
			<label for="convergence">Convergence: <span id="convergenceValue">12</span></label><br>
			<input id="convergence" type="range" min="1" max="50" step="0.5" value="12.00">
		</div>
	</div>

</div>


</body></html>
